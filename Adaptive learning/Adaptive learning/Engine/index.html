<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroLog | Log Study Session</title>
    <meta name="description"
        content="Log your study session — subject, topic, difficulty and context — to power your personalised memory decay engine.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob top-left"></div>
        <div class="blob bottom-right"></div>
        <div class="blob mid-center"></div>
    </div>

    <div class="container" id="main-container">

        <!-- ── Header ── -->
        <div class="header">
            <div class="brand-badge">NeuroLog · Adaptive Learning</div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your personalised memory decay engine</p>
        </div>

        <!-- ── Auth Form ── -->
        <div class="glass-card auth-card">
            
            <button id="google-auth-btn" class="auth-btn google-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="google-icon">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <form id="auth-form" novalidate>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="auth-btn submit-btn" id="submit-btn">
                    <span class="btn-text" id="auth-submit-text">Log In</span>
                    <span class="btn-loader loader-hidden"></span>
                </button>
            </form>

            <div class="auth-footer">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button type="button" id="auth-toggle-btn" class="auth-link">Sign Up</button>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>
        </div>

        <!-- Firebase config notice (shown until configured) -->
        <div id="firebase-notice" class="firebase-notice hidden">
            ⚠️ Firebase not configured yet —
            <a href="#" id="notice-link">see setup instructions</a>
        </div>

    </div>

    <!-- Firebase SDK (CDN) -->
    <script type="module" src="script.js"></script>
</body>

</html>
